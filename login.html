<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Energy Meter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f5f4;
            --panel: #ffffff;
            --border: #dde2e0;
            --border-strong: #c3cbc8;
            --text: #13231f;
            --text-muted: #5c6b67;
            --text-faint: #8b9793;
            --accent: #015b53;
            --accent-soft: #e7efee;
            --critical: #a3271f;
            --critical-soft: #faeae9;
            --radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px 32px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 32px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }

        .logo-mark {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 1px;
        }

        h1 {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 11px 13px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            color: var(--text);
            margin-bottom: 18px;
            transition: border-color 0.15s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--panel);
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.1px;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.15s ease;
        }

        button:hover { background: #014a44; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .error-message {
            display: none;
            align-items: flex-start;
            gap: 8px;
            background: var(--critical-soft);
            color: var(--critical);
            font-size: 13px;
            font-weight: 500;
            padding: 11px 13px;
            border-radius: var(--radius);
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
        }

        .back-link:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <span class="logo-mark"></span>
            Energy Meter
        </div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in with the account you were given to view live and historical readings.</p>

        <div class="error-message" id="error-message"></div>

        <form id="login-form">
            <label for="email">Email or username</label>
            <input type="text" id="email" required autocomplete="username">

            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password">

            <button type="submit" id="login-button">Log in</button>
        </form>

        <a href="index.html" class="back-link">&larr; Back to home</a>
    </div>

    <script>
        // Keep this in sync with the same value in dashboard.html
        const BACKEND_URL = "https://celebrity-bob-begun-band.trycloudflare.com";

        const form = document.getElementById("login-form");
        const errorBox = document.getElementById("error-message");
        const loginButton = document.getElementById("login-button");

        // If a still-valid session already exists, skip straight to the dashboard
        const existingToken = localStorage.getItem("auth_token");
        if (existingToken) {
            fetch(BACKEND_URL + "/api/verify", {
                headers: { "Authorization": "Bearer " + existingToken }
            })
                .then(res => res.json())
                .then(data => {
                    if (data.valid) window.location.href = "dashboard.html";
                })
                .catch(() => { /* backend unreachable - just stay on login */ });
        }

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            errorBox.style.display = "none";
            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            fetch(BACKEND_URL + "/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            })
                .then(async (res) => {
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || "Login failed");
                    localStorage.setItem("auth_token", data.token);
                    localStorage.setItem("auth_email", data.email);
                    window.location.href = "dashboard.html";
                })
                .catch(function (err) {
                    errorBox.textContent = err.message === "Failed to fetch"
                        ? "Could not reach the server. Is it running?"
                        : err.message;
                    errorBox.style.display = "flex";
                    loginButton.disabled = false;
                    loginButton.textContent = "Log in";
                });
        });
    </script>
</body>
</html>
